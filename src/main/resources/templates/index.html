<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventhub Home</title>
</head>
<body>
    <h1>Welcome to Eventhub</h1>
    <p>Below are the events currently in the system:</p>
    <ul>
        <li th:each="event : ${events}">
            <strong th:text="${event.title}"></strong> -
            <span th:text="${event.location}"></span> on
            <span th:text="${#temporals.format(event.eventDate,'yyyy-MM-dd HH:mm')}"></span>
        </li>
    </ul>
</body>
</html>
