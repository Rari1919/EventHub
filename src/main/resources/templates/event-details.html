<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventHub - Event Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EventHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/events-page">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="/favorites-page/1">Favorites</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tickets-page/1">My Tickets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login-page">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8">
                <img th:src="${event.imageUrl}" class="img-fluid mb-4" alt="Event Image">
                <h1 th:text="${event.title}"></h1>
                <p class="lead" th:text="${event.description}"></p>
                <p><strong>Date:</strong> <span th:text="${#temporals.format(event.eventDate, 'MMM dd, yyyy HH:mm')}"></span></p>
                <p><strong>Location:</strong> <span th:text="${event.location}"></span></p>
                <span class="badge bg-secondary" th:text="${event.category}"></span>
                <p class="mt-3"><strong>Price:</strong> $<span th:text="${event.price}"></span></p>
                <p><strong>Seats:</strong> <span th:text="${event.availableSeats}"></span>/<span th:text="${event.totalSeats}"></span></p>

                <h3 class="mt-5">Comments</h3>
                <div class="mb-4">
                    <form th:action="@{/events-page/{id}/comments(id=${event.id})}" method="post">
                        <div class="mb-3">
                            <label for="userId" class="form-label">User ID</label>
                            <input type="number" class="form-control" id="userId" name="userId" required>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Comment</label>
                            <textarea class="form-control" id="content" name="content" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Comment</button>
                    </form>
                </div>
                <div th:each="comment : ${comments}">
                    <div class="card mb-3">
                        <div class="card-body">
                            <p th:text="${comment.content}"></p>
                            <small class="text-muted">By User <span th:text="${comment.user.id}"></span> on <span th:text="${#temporals.format(comment.createdAt, 'MMM dd, yyyy')}"></span></small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Book Tickets</h5>
                        <form th:action="@{/events-page/{id}/book(id=${event.id})}" method="post">
                            <div class="mb-3">
                                <label for="userIdBook" class="form-label">User ID</label>
                                <input type="number" class="form-control" id="userIdBook" name="userId" required>
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Book Now</button>
                        </form>
                        <hr>
                        <h6>Add to Favorites</h6>
                        <form th:action="@{/events-page/{id}/favorite(id=${event.id})}" method="post">
                            <div class="mb-3">
                                <label for="userIdFav" class="form-label">User ID</label>
                                <input type="number" class="form-control" id="userIdFav" name="userId" required>
                            </div>
                            <button type="submit" class="btn btn-outline-primary w-100">Add to Favorites</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2026 EventHub. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
