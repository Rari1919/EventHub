<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventHub - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EventHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/events-page">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="/favorites-page/1">Favorites</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tickets-page/1">My Tickets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login-page">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero bg-primary text-white py-5">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">Discover Amazing Events</h1>
            <p class="lead">Book tickets for concerts, parties, and more. Your next adventure awaits!</p>
            <a href="/events-page" class="btn btn-light btn-lg">Browse Events</a>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">Featured Events</h2>
            <div class="row">
                <div class="col-md-4 mb-4" th:each="event : ${events}">
                    <div class="card h-100 shadow-sm">
                        <img th:src="${event.imageUrl}" class="card-img-top" alt="Event Image">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${event.title}"></h5>
                            <p class="card-text"><i class="bi bi-geo-alt"></i> <span th:text="${event.location}"></span></p>
                            <p class="card-text"><i class="bi bi-calendar"></i> <span th:text="${#temporals.format(event.eventDate, 'MMM dd, yyyy')}"></span></p>
                            <span class="badge bg-secondary" th:text="${event.category}"></span>
                            <p class="mt-2 fw-bold">$<span th:text="${event.price}"></span></p>
                            <a th:href="@{/events-page/{id}(id=${event.id})}" class="btn btn-primary">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2026 EventHub. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
