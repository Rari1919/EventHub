<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventHub - My Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EventHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/events-page">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="/favorites-page/1">Favorites</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tickets-page/1">My Tickets</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login-page">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="text-center mb-4">My Tickets</h1>
        <div th:if="${#lists.isEmpty(bookings)}">
            <p class="text-center text-muted">You have no tickets yet.</p>
        </div>
        <div th:if="${!#lists.isEmpty(bookings)}">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Event Title</th>
                            <th>Date</th>
                            <th>Quantity</th>
                            <th>Total Price</th>
                            <th>Ticket Code</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="booking : ${bookings}">
                            <td th:text="${booking.event.title}"></td>
                            <td th:text="${#temporals.format(booking.event.eventDate, 'MMM dd, yyyy')}"></td>
                            <td th:text="${booking.quantity}"></td>
                            <td>$<span th:text="${booking.totalPrice}"></span></td>
                            <td th:text="${booking.ticketCode}"></td>
                            <td><span class="badge bg-success">Confirmed</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2026 EventHub. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
